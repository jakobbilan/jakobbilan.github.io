    <script>
        // 1. WHERE THE SIX JSON FILES ARE: raw GitHub links to the files saved by the Python loop,
        //    with the local data folder as a fallback.
        const RAW_BASE = "https://raw.githubusercontent.com/jakobbilan/jakobbilan.github.io/main/data/devolution/";
        const LOCAL_BASE = "data/devolution/";

        // 2. THE LIST TO LOOP OVER: one entry per chart
        const SERIES = [
            { file: "gva_per_head.json",         title: "Economic output (GVA) per resident",    unit: "£ per resident, current prices" },
            { file: "pay_fulltime.json",         title: "Median full-time pay of residents",     unit: "£ a year" },
            { file: "employment_rate.json",      title: "Employment rate, ages 16 to 64",        unit: "% of residents aged 16 to 64" },
            { file: "life_expectancy_male.json", title: "Male life expectancy at birth",         unit: "Years, three-year average" },
            { file: "old_age_dependency.json",   title: "People aged 65+ per 100 aged 16 to 64", unit: "Old-age dependency ratio" },
            { file: "emissions_per_head.json",   title: "Greenhouse gas emissions per resident", unit: "Tonnes of CO2 equivalent" }
        ];

        // 3. A TEMPLATE CHART, the same for every series except the data link. Its look (fonts, axes, colours)
        //    comes from the project's theme, project/charts/theme.json, as on the project page.
        const TEMPLATE = {
            "$schema": "https://vega.github.io/schema/vega-lite/v5.json",
            "description": "Line chart of one indicator for England's strategic authorities: Greater Manchester in red, Greater London dashed grey, the others light grey, and a marker at 2017, the first Greater Manchester mayoral election. Hovering shows Greater Manchester, Greater London and the median authority for the nearest year.",
            "width": "container",
            "height": 220,
            "data": { "url": "", "format": { "type": "json", "property": "data" } },
            "encoding": {
                "x": { "field": "year", "type": "quantitative", "title": null, "scale": { "zero": false, "nice": false },
                       "axis": { "format": "d", "tickCount": 4 } },
                "y": { "field": "value", "type": "quantitative", "scale": { "zero": false },
                       "axis": { "labelExpr": "abs(datum.value) >= 10000 ? format(datum.value / 1000, ',.0f') + 'k' : format(datum.value, ',')",
                                 "tickCount": 5, "minExtent": 34 } }
            },
            "layer": [
                { "data": { "values": [{ "year": 2017 }] },
                  "mark": { "type": "rule", "color": "#5b636d", "strokeDash": [2, 3], "strokeWidth": 1 },
                  "encoding": { "y": null } },
                { "mark": { "type": "line", "color": "#c9ced4", "strokeWidth": 1.3 },
                  "encoding": { "detail": { "field": "geo_id" } } },
                { "transform": [{ "filter": "datum.geo_id == 'MSA022'" }],
                  "mark": { "type": "line", "color": "#5b636d", "strokeWidth": 1.6, "strokeDash": [5, 3] } },
                { "transform": [{ "filter": "datum.geo_id == 'MSA001'" }],
                  "mark": { "type": "line", "color": "#c4532d", "strokeWidth": 2.6 } },
                { "transform": [
                    { "joinaggregate": [{ "op": "median", "field": "value", "as": "median" }], "groupby": ["year"] },
                    { "filter": "datum.geo_id == 'MSA001' || datum.geo_id == 'MSA022'" },
                    { "pivot": "geo_id", "value": "value", "groupby": ["year", "date", "median"] },
                    { "calculate": "{'title': datum.date, 'Greater Manchester': format(datum.MSA001, ',.3~r'), 'Greater London': format(datum.MSA022, ',.3~r'), 'Median authority': format(datum.median, ',.3~r')}", "as": "card" }],
                  "mark": { "type": "rule", "color": "#16191d", "strokeWidth": 1 },
                  "params": [{ "name": "hover", "select": { "type": "point", "fields": ["year"], "nearest": true, "on": "pointerover", "clear": "pointerout" } }],
                  "encoding": { "y": null,
                                "opacity": { "condition": { "param": "hover", "empty": false, "value": 1 }, "value": 0 },
                                "tooltip": { "field": "card", "type": "nominal" } } }
            ]
        };

        // Same embed options as the project page: no menu, £ number formats, the project's tooltip style
        const OPTIONS = {
            renderer: "svg",
            actions: false,
            formatLocale: { decimal: ".", thousands: ",", grouping: [3], currency: ["£", ""] },
            tooltip: { theme: "custom" }
        };

        // Use the raw GitHub files if they can be reached, otherwise the local folder
        async function pickBase() {
            try {
                const response = await fetch(RAW_BASE + SERIES[0].file, { method: "HEAD" });
                if (response.ok) return RAW_BASE;
            } catch (err) { /* offline or blocked */ }
            console.warn("Raw GitHub files not reachable; using " + LOCAL_BASE);
            return LOCAL_BASE;
        }

        // 4. THE LOOP: one embed call, run once per series (six times)
        async function drawDashboard() {
            const base = await pickBase();
            const theme = await fetch("project/charts/theme.json").then(r => (r.ok ? r.json() : {})).catch(() => ({}));
            for (let i = 0; i < SERIES.length; i++) {
                const spec = structuredClone(TEMPLATE);              // a fresh copy for each chart
                spec.data.url = base + SERIES[i].file;
                document.getElementById(`title-c${i + 1}`).textContent = SERIES[i].title;
                document.getElementById(`unit-c${i + 1}`).textContent = SERIES[i].unit;
                vegaEmbed(`#c${i + 1}`, spec, Object.assign({ config: theme }, OPTIONS))
                    .catch(err => console.error(`chart ${i + 1}`, err));
            }
        }

        // Tooltips on touch screens close on scroll and with Escape, as on the project page
        function hideTooltips() {
            document.querySelectorAll("#vg-tooltip-element.visible, .vg-tooltip.visible").forEach(tip => tip.classList.remove("visible"));
        }
        window.addEventListener("scroll", hideTooltips, { passive: true });
        document.addEventListener("keydown", event => { if (event.key === "Escape") hideTooltips(); });

        // the Vega scripts load with "defer", so start once the page is parsed
        document.addEventListener("DOMContentLoaded", drawDashboard);

        // For the author, in the browser console: text still marked as draft
        document.addEventListener("DOMContentLoaded", () => {
            const drafts = document.querySelectorAll(".draft");
            if (drafts.length) console.warn(drafts.length + " passages still marked as draft:", [...drafts].map(d => d.textContent.trim()).join(" "));
        });
    </script>
