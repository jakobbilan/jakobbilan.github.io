name: Update project data

on:
  schedule:
    - cron: "17 6 1,20 * *"
  workflow_dispatch:
    inputs:
      refresh:
        description: "Download every source again"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: project-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Test
        run: python -m pytest -q pipeline/tests

      - name: Restore downloads
        uses: actions/cache@v4
        with:
          path: pipeline/cache
          key: sources-${{ github.run_id }}
          restore-keys: sources-

      - name: Build
        run: python -m pipeline.build ${{ inputs.refresh && '--refresh' || '' }}

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add project/data project/geo
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update project data ($(date -u +%Y-%m-%d))"
            git push
          fi
